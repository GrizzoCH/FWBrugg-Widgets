<!-- Load Chart.js from CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- Load Chart.js DataLabels Plugin -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<!-- Widget Container: Fluid layout -->
<div style="width: 100%; height: 100%; min-height: 320px; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; font-family: Arial, sans-serif; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; box-sizing: border-box;">
  
  <!-- Header -->
  <div style="background: #eb0000; color: white; padding: 14px 18px; font-weight: bold; font-size: 15px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
    <span>Lokalprognose Brugg (AG)</span>
    <span style="font-size: 13px; font-weight: normal; opacity: 0.95;">Nächste 24h &bull; Aktualisiert: <span id="ms-last-updated">--:--</span></span>
  </div>
  
  <!-- Main Body Container with Pinched Fixed Side Axes -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; background: #fdfdfd; overflow: hidden; position: relative;">
    
    <!-- Middle Wrapper holding Pinned Left Axis, Scrollable Chart Body + Top Bar, and Pinned Right Axis -->
    <div style="flex-grow: 1; display: flex; position: relative; overflow: hidden;">
      
      <!-- Pinned Left Axis (Temperature °C) -->
      <div id="pinned-left-axis" style="width: 55px; background: #fff; border-right: 1px solid #eee; display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; z-index: 5; pointer-events: none; padding: 50px 0 5px 0; box-sizing: border-box; text-align: right;">
        <!-- Injected via JS -->
      </div>

      <!-- Scrollable container containing both the Top Bar and Main Chart Canvas together -->
      <div id="scrollable-pane" style="flex-grow: 1; overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth;">
        <div id="chart-scroll-wrapper" style="height: 100%; display: flex; flex-direction: column; position: relative;">
          
          <!-- Top Bar Row: Weather Icons and Hours -->
          <div id="ms-top-bar" style="display: flex; height: 50px; border-bottom: 1px solid #eee; background: #fff; flex-shrink: 0;">
            <!-- JavaScript injects icon columns here -->
          </div>
          
          <!-- Graph Area -->
          <div style="flex-grow: 1; min-height: 220px; position: relative;">
            <canvas id="ms-chart" style="display: block; width: 100%; height: 100%;"></canvas>
          </div>
          
        </div>
      </div>

      <!-- Pinned Right Axis (Precipitation mm) -->
      <div id="pinned-right-axis" style="width: 55px; background: #fff; border-left: 1px solid #eee; display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; z-index: 5; pointer-events: none; padding: 50px 0 5px 0; box-sizing: border-box; text-align: left;">
        <!-- Injected via JS -->
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div style="padding: 10px 14px; font-size: 11px; color: #777; text-align: right; background: #f8f9fa; border-top: 1px solid #eee; flex-shrink: 0;">
    Daten: Open-Meteo (MeteoSwiss Modell)
  </div>
</div>

<script>
let weatherChartInstance = null;

async function loadMeteoSwissGraphWidget() {
  const lat = 47.48;
  const lon = 8.21;
  
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation,precipitation_probability,weather_code&forecast_hours=24&timezone=Europe%2FBerlin`;

  try {
    const response = await fetch(url);
    const data = await response.json();
    
    if (data.error) {
       console.error("API Error:", data.reason);
       return;
    }

    const times = data.hourly.time;
    const temps = data.hourly.temperature_2m;
    const precip = data.hourly.precipitation;
    const precipProb = data.hourly.precipitation_probability;
    const codes = data.hourly.weather_code;

    const now = new Date();
    const updateHours = String(now.getHours()).padStart(2, '0');
    const updateMinutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('ms-last-updated').textContent = `${updateHours}:${updateMinutes}`;

    const getIcon = (code) => {
      if (code <= 1) return '☀️'; 
      if (code <= 3) return '⛅'; 
      if (code <= 48) return '🌫️'; 
      if (code <= 57) return '🌧️'; 
      if (code <= 67) return '🌧️'; 
      if (code <= 77) return '❄️'; 
      if (code <= 82) return '🌦️'; 
      return '⛈️'; 
    };

    // Populate top bar
    const topBarContainer = document.getElementById('ms-top-bar');
    topBarContainer.innerHTML = '';
    
    times.forEach((timeStr, i) => {
      const date = new Date(timeStr);
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const timeFormatted = `${hours}:${minutes}`;
      
      const col = document.createElement('div');
      col.style.cssText = 'flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px;';
      col.innerHTML = `
        <div style="font-size: 16px; line-height: 1.1;">${getIcon(codes[i])}</div>
        <div style="font-weight: 700; color: #444; margin-top: 3px;">${timeFormatted}</div>
      `;
      topBarContainer.appendChild(col);
    });

    // Set scrollable inner container width dynamically (approx 65px per hour column)
    const scrollWrapper = document.getElementById('chart-scroll-wrapper');
    scrollWrapper.style.width = `${Math.max(times.length * 65, 1200)}px`;

    const dynamicBackgroundColors = precipProb.map(prob => {
      const alpha = Math.max(0.1, (prob / 100) * 0.9);
      return `rgba(0, 112, 192, ${alpha})`;
    });

    // Calculate nice rounded 5-unit bounds for temperature
    const minTemp = Math.min(...temps);
    const maxTemp = Math.max(...temps);
    const tempMin = Math.floor((minTemp - 3) / 5) * 5;
    const tempMax = Math.ceil((maxTemp + 3) / 5) * 5;

    // Calculate nice rounded 5-unit bounds for precipitation
    const maxPrecip = Math.max(...precip);
    const rainMax = Math.max(5, Math.ceil((maxPrecip * 1.2) / 5) * 5);
    const rainMin = 0;

    const ctx = document.getElementById('ms-chart').getContext('2d');
    
    if (weatherChartInstance) {
      weatherChartInstance.destroy();
    }
    
    weatherChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: times.map(t => {
          const d = new Date(t);
          return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }),
        datasets: [
          {
            label: 'Temperatur (°C)',
            data: temps,
            borderColor: '#eb0000',
            backgroundColor: 'rgba(235, 0, 0, 0.08)',
            borderWidth: 2.5,
            pointRadius: 4,
            pointHoverRadius: 7,
            fill: true,
            yAxisID: 'yTemp',
            tension: 0.4,
            datalabels: {
              align: 'top',
              anchor: 'end',
              color: '#eb0000',
              font: { weight: 'bold', size: 12 },
              formatter: (value) => Math.round(value) + '°'
            }
          },
          {
            label: 'Niederschlag (mm)',
            data: precip,
            type: 'bar',
            backgroundColor: dynamicBackgroundColors,
            borderWidth: 0,
            yAxisID: 'yRain',
            barPercentage: 0.8,
            categoryPercentage: 0.9,
            datalabels: {
              align: 'end',
              anchor: 'start',
              color: '#004070',
              font: { weight: 'bold', size: 11 },
              formatter: (value, context) => {
                const index = context.dataIndex;
                const prob = precipProb[index] || 0;
                if (value > 0.0 || prob > 15) {
                  return `${value > 0 ? value + 'mm' : ''} (${prob}%)`;
                }
                return '';
              }
            }
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 35, right: 10, bottom: 5, left: 10 } },
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          datalabels: { display: true },
          tooltip: {
            backgroundColor: 'rgba(255, 255, 255, 0.95)',
            titleColor: '#222',
            titleFont: { size: 13, weight: 'bold' },
            bodyColor: '#333',
            bodyFont: { size: 12 },
            borderColor: '#ccc',
            borderWidth: 1,
            padding: 12,
            callbacks: {
              title: (tooltipItems) => 'Uhrzeit: ' + tooltipItems[0].label,
              label: (context) => {
                if (context.datasetIndex === 0) {
                  return `Temperatur: ${Math.round(context.raw)}°C`;
                } else {
                  const index = context.dataIndex;
                  const prob = precipProb[index] || 0;
                  const mm = precip[index] || 0;
                  return `Niederschlag: ${mm} mm (Wahrscheinlichkeit: ${prob}%)`;
                }
              }
            }
          }
        },
        scales: {
          x: { display: false, offset: true },
          yTemp: {
            type: 'linear',
            display: false,
            min: tempMin,
            max: tempMax
          },
          yRain: {
            type: 'linear',
            display: false,
            min: rainMin,
            max: rainMax
          }
        }
      },
      plugins: [ChartDataLabels]
    });

    // Generate step-of-5 side axis markers dynamically from bottom to top
    const leftAxisEl = document.getElementById('pinned-left-axis');
    const rightAxisEl = document.getElementById('pinned-right-axis');

    let leftHTML = `<div style="font-size: 10px; font-weight: bold; color: #777; padding-left: 6px;">°C</div>`;
    for (let val = tempMax; val >= tempMin; val -= 5) {
      leftHTML += `<div style="font-size: 11px; color: #555; padding-right: 8px;">${val}°</div>`;
    }
    leftHTML += `<div style="height: 5px;"></div>`;
    leftAxisEl.innerHTML = leftHTML;

    let rightHTML = `<div style="font-size: 10px; font-weight: bold; color: #777; padding-left: 8px;">mm</div>`;
    for (let val = rainMax; val >= rainMin; val -= 5) {
      rightHTML += `<div style="font-size: 11px; color: #555; padding-left: 8px;">${val}</div>`;
    }
    rightHTML += `<div style="height: 5px;"></div>`;
    rightAxisEl.innerHTML = rightHTML;

  } catch (error) {
    console.error("Fetch Error:", error);
  }
}

loadMeteoSwissGraphWidget();
setInterval(loadMeteoSwissGraphWidget, 1800000);
</script>
